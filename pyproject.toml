[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memimpact"
version = "0.1.0"
description = "Planner-level counterfactual memory auditing for selective verification"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.27.2",
  "openai==1.17.0",
  "pydantic==2.7.4",
]

[tool.setuptools.packages.find]
include = ["memimpact*"]
